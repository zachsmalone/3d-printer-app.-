name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: Include steps to reproduce.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Commit / branch / printer model}
  - type: textarea
    id: logs
    attributes: {label: Logs or screenshots, render: shell}
