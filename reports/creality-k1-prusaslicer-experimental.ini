# Experimental minimal PrusaSlicer 2.9 profile for Creality K1 (base). UNTESTED ON REAL HARDWARE.
# Sources: build volume/nozzle: creality.com K1 spec; macros: Orca "Creality K1 (0.4 nozzle).json"; axis limits: CrealityOfficial/K1_Series_Klipper printer.cfg
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = klipper
use_relative_e_distances = 1
use_firmware_retraction = 0
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 300
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 20000
machine_max_feedrate_x = 800
machine_max_feedrate_y = 800
machine_max_feedrate_z = 20
machine_max_feedrate_e = 100
machine_max_jerk_x = 20
machine_max_jerk_y = 20
machine_max_jerk_z = 5
machine_max_jerk_e = 10
retract_length = 0.8
retract_speed = 40
retract_lift = 0.4
temperature = 220
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
thumbnails = 96x96,300x300
start_gcode = START_PRINT EXTRUDER_TEMP={first_layer_temperature[initial_extruder]} BED_TEMP=[first_layer_bed_temperature]\nM204 S2000\nM109 S{first_layer_temperature[initial_extruder]}\nG1 Z3 F600\nM83\nG92 E0\nG1 Z1 F600
end_gcode = END_PRINT
