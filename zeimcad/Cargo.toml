[package]
name = "zeimcad"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ZEIMCad - a Rust translation of SolveSpace (parametric 2D/3D CAD) with first-class imported-file editing"

[[bin]]
name = "ZEIMCad"
path = "src/main.rs"

[lib]
name = "zeimcad"
path = "src/lib.rs"
